name: BridgeWatch CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/exp07-anomaly-severity-sweep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build production application
        run: npm run build
